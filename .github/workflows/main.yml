name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Build Android APK
        uses: docker://ghcr.io/pwabuilder/cli:latest
        with:
          args: android --url https://z46689944-beep.github.io/YarKeshavarz/
