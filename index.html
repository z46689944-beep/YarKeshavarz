<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b3d2e">
<meta name="description" content="یار کشاورز — مدیریت زمین، کشت، هزینه، انبار و آب‌وهوا">
<!-- YarKeshavarz Trial 53 - AI assistant structure phase -->
<title>یار کشاورز V3</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/@tomickigrzegorz/leaflet-rotate@0.2.4/dist/leaflet-rotate.css">

<style>
:root{
--g:#0b3d2e;
--g2:#17664b;
--bg:#f4f7f4;
--card:#fff;
--text:#17352b;
--muted:#71817a;
--line:#e1e9e4;
--red:#a33a3a;
--shadow:0 10px 28px rgba(14,55,41,.08)
}

*{box-sizing:border-box}

body{
margin:0;
background:var(--bg);
color:var(--text);
font-family:Tahoma,Arial,sans-serif
}

button,input,select,textarea{font:inherit}
button{cursor:pointer}

.top{
position:sticky;
top:0;
z-index:1000;
height:66px;
background:var(--g);
color:#fff;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 14px;
box-shadow:0 5px 18px #0002
}

.brand{
display:flex;
align-items:center;
gap:10px
}

.logo{
width:42px;
height:42px;
border-radius:13px;
background:#ffffff18;
display:grid;
place-items:center;
font-size:25px
}

.brand b{display:block}
.brand small{opacity:.7;font-size:10px}

.top button{
border:0;
background:#ffffff18;
color:#fff;
border-radius:12px;
width:40px;
height:40px;
font-size:20px
}

main{
max-width:900px;
margin:auto;
padding:14px 12px 95px
}

.hero{
min-height:210px;
border-radius:24px;
padding:22px;
color:#fff;
display:flex;
flex-direction:column;
justify-content:end;
background:linear-gradient(135deg,#0b3d2e,#287659);
box-shadow:var(--shadow);
margin-bottom:14px
}

.hero h1{
margin:0 0 7px;
font-size:28px
}

.hero p{
margin:0;
opacity:.86;
font-size:13px
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px
}

.card{
background:var(--card);
border:1px solid var(--line);
border-radius:18px;
padding:14px;
box-shadow:var(--shadow)
}

.metric{
font-size:22px;
font-weight:900;
margin-top:5px
}

.muted{color:var(--muted)}
.small{font-size:11px}

.section{
display:flex;
align-items:center;
justify-content:space-between;
gap:8px;
margin:19px 2px 9px
}

.section h2,.section h3{margin:0}

.quick{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:8px
}

.quick button{
min-height:78px;
border:1px solid var(--line);
background:#fff;
border-radius:16px;
font-weight:800;
color:var(--g)
}

.primary,.secondary,.danger{
border:0;
border-radius:12px;
padding:10px 13px;
font-weight:800
}

.primary{
background:var(--g);
color:#fff
}

.secondary{
background:#eaf2ee;
color:var(--g)
}

.danger{
background:#f8e8e8;
color:var(--red)
}

.list{
display:grid;
gap:10px
}

.row{
display:flex;
align-items:center;
justify-content:space-between;
gap:9px
}

.actions{
display:flex;
gap:7px;
flex-wrap:wrap;
margin-top:11px
}

.badge{
display:inline-block;
background:#edf4ef;
color:var(--g);
border-radius:99px;
padding:4px 8px;
font-size:10px
}

.empty{
text-align:center;
color:var(--muted);
padding:28px
}

.form{
display:grid;
gap:12px
}

.field{
display:grid;
gap:6px
}

.field label{
font-size:12px;
font-weight:800
}

.field input,
.field select,
.field textarea{
width:100%;
border:1px solid #d7e2dc;
background:#fff;
border-radius:12px;
padding:11px;
color:var(--text);
outline:none
}

.field textarea{min-height:90px}

.tabs{
display:flex;
gap:7px;
overflow:auto;
padding:4px 0 9px
}

.tabs button{
white-space:nowrap;
border:1px solid var(--line);
background:#fff;
border-radius:11px;
padding:9px 12px
}

.tabs button.active{
background:var(--g);
color:#fff
}

.bottom{
position:fixed;
bottom:0;
left:0;
right:0;
height:74px;
background:#fffefcfa;
border-top:1px solid var(--line);
display:grid;
grid-template-columns:repeat(5,1fr);
z-index:3000;
padding-bottom:env(safe-area-inset-bottom);
backdrop-filter:blur(12px)
}

.bottom button{
border:0;
background:none;
color:#78857f;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:3px;
font-size:21px
}

.bottom button span{font-size:9px}

.bottom button.active{
color:var(--g);
font-weight:900
}

.weather-now{
background:linear-gradient(135deg,#0b3d2e,#247557);
color:#fff;
border-radius:22px;
padding:18px
}

.weather-temp{
font-size:48px;
font-weight:900
}

.weather-icon{font-size:55px}

.forecast{
display:grid;
gap:7px
}

.day{
display:grid;
grid-template-columns:1.4fr .5fr .7fr .8fr;
align-items:center;
background:#f6f9f7;
border-radius:14px;
padding:10px
}

.weather-error{
padding:25px;
text-align:center
}

.measure-wrap{
position:fixed;
inset:0;
background:#fff;
z-index:5000;
padding:10px
}

.measure-map{
position:absolute;
inset:0
}

.measure-head{
position:absolute;
z-index:5100;
top:12px;
left:12px;
right:12px;
display:flex;
gap:7px
}

.measure-head input{
flex:1;
border:0;
border-radius:13px;
padding:12px;
box-shadow:0 7px 22px #0002
}

.measure-tools{
position:absolute;
z-index:5100;
top:62px;
right:12px;
display:flex;
gap:6px
}

.measure-tools button{
width:42px;
height:42px;
cursor:pointer;
border:0;
border-radius:12px;
background:#fff;
box-shadow:0 7px 20px #0002
}

.measure-bottom{
position:absolute;
z-index:5100;
bottom:10px;
left:10px;
right:10px;
background:#fffffff7;
border-radius:18px;
padding:9px;
box-shadow:0 7px 25px #0003;
max-width:620px;
margin:auto
}

.measure-stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:5px;
text-align:center;
margin-bottom:7px
}

.measure-stats b{
display:block;
font-size:12px
}

.measure-stats span{
font-size:8px;
color:var(--muted)
}

.measure-actions{
display:grid;
grid-template-columns:1fr 1fr;
gap:7px
}

.gps,#register{
width:100%;
min-height:46px;
margin:0;
font-size:13px;
position:relative;
z-index:2;
box-sizing:border-box;
border:0;
border-radius:13px;
padding:10px;
font-weight:900
}

.gps{
background:#8f2929;
color:#fff
}

#measureStatus{
min-height:14px;
margin:4px 0 0
}

.hint{
text-align:center;
color:var(--muted);
font-size:9px;
margin:6px
}

#register:disabled{
opacity:.45;
cursor:not-allowed
}

.chat{
display:grid;
gap:8px
}

.bubble{
padding:11px 13px;
border-radius:15px;
max-width:90%;
line-height:1.9;
font-size:12px
}

.bot{
background:#eaf2ee
}

.me{
background:var(--g);
color:#fff;
margin-right:auto
}

.ad{
min-height:150px;
color:#fff;
background:linear-gradient(135deg,#153d31,#2b7155);
display:flex;
flex-direction:column;
justify-content:end
}

.news{
display:grid;
gap:10px
}

.news article{
background:#fff;
border:1px solid var(--line);
border-radius:17px;
padding:14px
}

.quick button{
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:4px;
font-size:12px
}

.quick button .qi{
font-size:27px;
line-height:1
}

.field-tools{
display:grid;
grid-template-columns:1fr 1fr;
gap:9px;
margin:10px 0
}

.field-tool{
border:1px solid var(--line);
background:#fff;
border-radius:16px;
padding:12px;
text-align:right;
display:grid;
grid-template-columns:auto 1fr;
column-gap:9px;
align-items:center;
box-shadow:var(--shadow);
color:var(--g)
}

.field-tool span{
grid-row:1/3;
font-size:31px
}

.field-tool b{font-size:14px}

.field-tool small{
font-size:9px;
color:var(--muted);
margin-top:2px
}

@media(max-width:420px){
.field-tools{grid-template-columns:1fr}
}

.stock-actions{
display:flex;
gap:8px;
margin-top:11px
}

.stock-actions button{
flex:1;
min-height:44px;
border:0;
border-radius:12px;
font-weight:900
}

.stock-plus{
background:#e7f3eb;
color:var(--g)
}

.stock-minus{
background:#fff0ed;
color:#9a3730
}

.calc-grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:7px
}

.calc-grid button{
min-height:52px;
border:1px solid var(--line);
background:#fff;
border-radius:12px;
font-weight:900
}

.calc-display{
background:#123f31;
color:#fff;
border-radius:16px;
padding:15px;
text-align:left;
font-size:26px;
font-weight:900;
direction:ltr;
min-height:62px
}

.crop-card{
border-right:4px solid var(--g2)
}

.crop-actions{
display:flex;
gap:7px;
flex-wrap:wrap;
margin-top:9px
}

.crop-actions button{
flex:1;
min-width:110px
}

.home-weather{
margin-top:14px;
background:#fff;
border:1px solid var(--line);
border-radius:20px;
padding:13px;
box-shadow:var(--shadow)
}

.home-weather-head{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px
}

.home-weather-main{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
margin-top:8px
}

.home-weather-temp{
font-size:38px;
font-weight:900
}

.home-weather-icon{
font-size:46px
}

.home-hourly{
display:flex;
gap:7px;
overflow-x:auto;
padding:9px 1px 3px;
scrollbar-width:none
}

.home-hour{
min-width:72px;
text-align:center;
background:#f3f8f5;
border-radius:13px;
padding:8px 5px
}

.home-hour b{
display:block;
font-size:11px
}

.home-hour span{
display:block;
font-size:23px;
margin:3px 0
}

.home-hour small{
font-size:10px;
color:var(--muted)
}

.hourly-grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:7px
}

.hour-card{
background:#f6f9f7;
border-radius:14px;
padding:9px;
text-align:center
}

.hour-card b{font-size:11px}

.hour-card .hi{
font-size:23px;
margin:4px 0
}

.hour-card small{
display:block;
color:var(--muted);
font-size:9px;
line-height:1.7
}

.weather-location-note{
background:#edf5f0;
border-radius:13px;
padding:9px;
font-size:11px;
color:var(--g);
margin-top:9px
}

.calc-land-head{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
margin-bottom:10px
}

.calc-area{
text-align:center;
background:#edf5f0;
border-radius:14px;
padding:8px 13px;
min-width:78px
}

.calc-area b{
display:block;
font-size:18px;
color:var(--g)
}

.calc-area small{
font-size:9px;
color:var(--muted)
}

.calc-form-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px
}

.calc-form-grid.two{
margin-top:8px
}

.calc-total{
margin-top:10px;
background:linear-gradient(135deg,#0b3d2e,#247557);
color:#fff;
text-align:center
}

.calc-total span,
.calc-total strong,
.calc-total small{
display:block
}

.calc-total strong{
font-size:26px;
margin:5px 0
}

.calc-total small{
opacity:.8
}

.calc-result-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
margin-top:10px
}

.calc-result-grid div{
background:#f3f8f5;
border-radius:14px;
padding:11px;
text-align:center
}

.calc-result-grid span{
display:block;
font-size:10px;
color:var(--muted)
}

.calc-result-grid b{
display:block;
font-size:16px;
margin-top:5px
}

.crop-focus{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
margin-bottom:10px
}

@media(max-width:430px){
.calc-form-grid{grid-template-columns:1fr}
.measure-actions{grid-template-columns:1fr 1fr}
}

.hero{
background-size:cover;
background-position:center center;
background-repeat:no-repeat
}

.hero:after{
content:'';
display:block;
height:1px;
width:100%
}

@media(max-width:560px){
main{padding:11px 9px 92px}
.quick{grid-template-columns:repeat(2,1fr)}
.stat4,.measure-stats{grid-template-columns:repeat(2,1fr)}
.day{grid-template-columns:1.3fr .5fr .7fr .7fr}
.weather-temp{font-size:42px}
}

.hero{
background-image:
linear-gradient(180deg,#0000 20%,#082c22d9 100%),
url("https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=1400&q=80");
background-size:cover;
background-position:center;
min-height:245px
}

.hero p{
font-weight:700;
text-shadow:0 2px 8px #0008
}

.icon-card{
display:flex;
align-items:center;
gap:10px
}

.icon-big{
width:48px;
height:48px;
border-radius:15px;
background:#edf4ef;
display:grid;
place-items:center;
font-size:27px
}

.photo-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:7px;
margin-top:10px
}

.photo-grid img{
width:100%;
aspect-ratio:1;
border-radius:13px;
object-fit:cover;
border:1px solid var(--line)
}

.profile-head{
display:flex;
align-items:center;
gap:12px
}

.avatar{
width:82px;
height:82px;
border-radius:50%;
object-fit:cover;
background:#eaf2ee;
border:3px solid #fff;
box-shadow:var(--shadow);
display:grid;
place-items:center;
font-size:35px
}

.equip-grid{
display:grid;
gap:10px
}

.equip-item{
display:grid;
grid-template-columns:54px 1fr auto;
gap:10px;
align-items:center
}

.equip-icon{
width:54px;
height:54px;
border-radius:16px;
background:#edf4ef;
display:grid;
place-items:center;
font-size:29px
}

.equip-meta{
font-size:11px;
color:var(--muted);
line-height:1.8
}

.weather-mini{
margin-top:10px;
border-radius:17px;
padding:12px;
background:#eef6f1
}

.weather-mini .temp{
font-size:27px;
font-weight:900
}

.weather-mini.loading{
color:var(--muted)
}

.profile-menu{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:8px;
margin-top:10px
}

.profile-menu button{
border:1px solid var(--line);
background:#fff;
border-radius:14px;
padding:13px;
font-weight:800;
color:var(--g)
}

@media(max-width:560px){
.hero{min-height:225px}
.photo-grid{grid-template-columns:repeat(3,1fr)}
}

.register-modal{
position:fixed;
inset:0;
z-index:9999;
background:#0008;
display:flex;
align-items:flex-end;
justify-content:center;
padding:12px
}

.register-card{
width:min(560px,100%);
background:#fff;
border-radius:22px;
padding:18px;
box-shadow:0 20px 60px #0005
}

.register-card h3{
margin:0 0 5px
}

.register-card label{
display:block;
margin-top:10px;
font-weight:800;
font-size:13px
}

.register-card input{
width:100%;
box-sizing:border-box;
margin-top:5px;
border:1px solid var(--line);
border-radius:12px;
padding:12px;
font:inherit
}

.register-summary{
margin:12px 0;
padding:12px;
border-radius:14px;
background:#f2f8f5;
display:flex;
flex-direction:column;
gap:4px
}

.register-summary b{
font-size:20px
}

.register-card .actions{
margin-top:14px;
display:grid;
grid-template-columns:1fr 1.4fr;
gap:8px
}

.hero{
background-size:cover!important;
background-position:center!important;
min-height:240px!important
}

.land-schematic{
padding:2px 0
}

.schematic-head{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:10px
}

.schematic-head span{
font-size:12px;
color:#718078
}

.land-schematic svg{
display:block;
width:100%;
height:auto;
border:1px solid #e1ebe6;
border-radius:14px;
background:#f8fbf9
}

.land-schematic svg text{
font-family:Tahoma,Arial,sans-serif;
fill:#17664b;
font-size:10px;
font-weight:700
}

.schematic-meta{
display:flex;
justify-content:space-between;
gap:10px;
margin-top:10px;
font-size:12px;
color:#66736d
}

.land-schematic.empty{
min-height:150px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
gap:7px;
color:#607069
}

.land-schematic.empty div{
font-size:32px
}

.land-schematic.empty small{
font-size:12px;
color:#8a9691
}

.schematic-modern{
background:linear-gradient(180deg,#f8fbf9,#eef5f1);
border:1px solid #dce9e2;
border-radius:22px;
padding:12px;
overflow:hidden
}

.schematic-modern .schematic-head{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:9px
}

.schematic-modern .schematic-head b{
font-size:15px
}

.schematic-modern svg{
width:100%;
height:auto;
display:block;
border-radius:17px;
background:#f7faf8
}

.schematic-modern .schematic-meta{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:7px;
margin-top:9px
}

.schematic-modern .schematic-meta div{
background:#fff;
border:1px solid #e1eae5;
border-radius:13px;
padding:9px;
text-align:center
}

.schematic-modern .schematic-meta span{
display:block;
font-size:9px;
color:var(--muted);
margin-bottom:4px
}

.schematic-modern .schematic-meta b{
font-size:13px;
color:var(--g)
}

.edit-points{
width:100%;
margin-top:9px
}

.edit-points-btn{
width:100%;
border:1px solid #cfe0d7;
background:#edf6f1;
color:var(--g);
border-radius:13px;
padding:11px;
font-weight:900
}

.fun-shell{
position:fixed;
inset:0;
z-index:9000;
background:linear-gradient(145deg,#071f18,#0d4d38 48%,#123d31);
color:#fff;
overflow:auto;
display:none
}

.fun-shell.show{
display:block
}

.fun-inner{
max-width:900px;
margin:auto;
padding:16px 13px 34px
}

.fun-top{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
margin-bottom:14px
}

.fun-top h1{
margin:0;
font-size:23px
}

.fun-top small{
opacity:.75
}

.fun-back{
border:1px solid #ffffff2b;
background:#ffffff18;
color:#fff;
border-radius:13px;
padding:10px 13px;
font-weight:900
}

.fun-score{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
margin-bottom:12px
}

.fun-score .fs{
background:#ffffff14;
border:1px solid #ffffff20;
backdrop-filter:blur(14px);
border-radius:17px;
padding:12px;
text-align:center;
box-shadow:0 12px 30px #0002
}

.fun-score b{
display:block;
font-size:21px
}

.fun-score span{
font-size:10px;
opacity:.72
}

.fun-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px
}

.fun-card{
border:1px solid #ffffff22;
background:linear-gradient(145deg,#ffffff18,#ffffff0b);
backdrop-filter:blur(18px);
border-radius:21px;
padding:15px;
box-shadow:0 16px 35px #0003

<style id="v3-fix-readability">
/* خوانایی متن در نسخه روشن */
body,
main,
section,
.card,

.content{

<script>
const YAR_AI_ENDPOINT='https://REPLACE-WITH-YOUR-WORKER.workers.dev';

const YK_KEY='yk-v3-clean';

let state={
  lands:[],
  inventory:[],
  profile:{},
  messages:[]
};

function loadState(){
  try{
    const raw=localStorage.getItem(YK_KEY);
    if(raw){
      const parsed=JSON.parse(raw);
      if(parsed && typeof parsed==='object'){
        state={...state,...parsed};
      }
    }
  }catch(e){
    console.warn('loadState',e);
  }

  if(!Array.isArray(state.lands))state.lands=[];
  if(!Array.isArray(state.inventory))state.inventory=[];
  if(!state.profile || typeof state.profile!=='object')state.profile={};
  if(!Array.isArray(state.messages))state.messages=[];
}

function saveState(){
  try{
    localStorage.setItem(YK_KEY,JSON.stringify(state));
  }catch(e){
    console.warn('saveState',e);
  }
}

loadState();

function esc(v){
  return String(v??'')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}

function money(v){
  const n=Number(v)||0;
  return n.toLocaleString('fa-IR');
}

function uid(){
  return Date.now().toString(36)+Math.random().toString(36).slice(2,8);
}

function toast(text){
  let el=document.querySelector('.toast');
  if(!el){
    el=document.createElement('div');
    el.className='toast';
    Object.assign(el.style,{
      position:'fixed',
      left:'50%',
      bottom:'88px',
      transform:'translateX(-50%)',
      zIndex:'99999',
      padding:'12px 16px',
      maxWidth:'90%',
      textAlign:'center'
    });
    document.body.appendChild(el);
  }
  el.textContent=text;
  el.style.display='block';
  clearTimeout(window.__toastTimer);
  window.__toastTimer=setTimeout(()=>{
    el.style.display='none';
  },2600);
}

function normalizeLand(l){
  l=l||{};
  return {
    id:l.id||uid(),
    name:l.name||'زمین بدون نام',
    region:l.region||'',
    owner:l.owner||'مالک',
    rent:l.rent||'',
    soil:l.soil||'',
    water:l.water||'',
    irrigation:l.irrigation||'',
    crop:l.crop||'',
    notes:l.notes||'',
    area:Number(l.area)||0,
    perimeter:Number(l.perimeter)||0,
    points:Array.isArray(l.points)?l.points:[],
    expenses:Array.isArray(l.expenses)?l.expenses:[],
    incomes:Array.isArray(l.incomes)?l.incomes:[],
    aiPhotos:Array.isArray(l.aiPhotos)?l.aiPhotos:[],
    aiAnalyses:Array.isArray(l.aiAnalyses)?l.aiAnalyses:[],
    weather:l.weather||null,
    createdAt:l.createdAt||Date.now(),
    updatedAt:Date.now()
  };
}

state.lands=state.lands.map(normalizeLand);
saveState();

function totalExpenses(l){
  return (l?.expenses||[]).reduce((s,x)=>s+(Number(x.total)||Number(x.amount)||0),0);
}

function totalIncome(l){
  return (l?.incomes||[]).reduce((s,x)=>s+(Number(x.amount)||0),0);
}

function profit(l){
  return totalIncome(l)-totalExpenses(l);
}

function formatArea(a){
  const n=Number(a)||0;
  if(n>=10000){
    return `${(n/10000).toLocaleString('fa-IR',{maximumFractionDigits:2})} هکتار`;
  }
  return `${n.toLocaleString('fa-IR',{maximumFractionDigits:2})} مترمربع`;
}

function landThumb(l){
  const pts=Array.isArray(l.points)?l.points:[];
  let p=pts;

  if(p.length<3){
    p=[
      [18,46],[30,20],[61,12],[87,31],
      [79,67],[49,84],[22,73]
    ];
  }else{
    const xs=p.map(x=>Number(x[1]??x.lng??x.x??0));
    const ys=p.map(x=>Number(x[0]??x.lat??x.y??0));
    const minX=Math.min(...xs),maxX=Math.max(...xs);
    const minY=Math.min(...ys),maxY=Math.max(...ys);
    const dx=maxX-minX||1,dy=maxY-minY||1;
    p=p.map(x=>[
      10+((Number(x[0]??x.lat??x.y??0)-minY)/dy)*80,
      10+((Number(x[1]??x.lng??x.x??0)-minX)/dx)*80
    ]);
  }

  const path=p.map((x,i)=>
    `${i?'L':'M'} ${Number(x[1]).toFixed(1)} ${Number(x[0]).toFixed(1)}`
  ).join(' ')+' Z';

  return `
  <div class="land-thumb" aria-hidden="true">
    <svg viewBox="0 0 100 100" preserveAspectRatio="none">
      <defs>
        <linearGradient id="lg${esc(l.id)}" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#72bd79"/>
          <stop offset="100%" stop-color="#d7edc9"/>
        </linearGradient>
      </defs>
      <rect width="100" height="100" fill="#edf7e8"/>
      <path d="${path}" fill="url(#lg${esc(l.id)})" stroke="#26734b" stroke-width="2"/>
      <path d="M5 78 Q35 60 58 76 T98 67"
        fill="none" stroke="#9ac98b" stroke-width="2" opacity=".8"/>
    </svg>
  </div>`;
}

function openLand(id){
  const l=state.lands.find(x=>x.id===id);
  if(!l){
    toast('زمین پیدا نشد');
    return;
  }

  window.currentLandId=id;

  const cost=totalExpenses(l);
  const income=totalIncome(l);
  const net=income-cost;

  const app=document.querySelector('#app')||document.body;

  app.innerHTML=`
  <main class="content">
    <div class="land-head">
      <div>
        <button class="btn" onclick="go('lands')">← بازگشت</button>
      </div>
      <div style="text-align:right">
        <h2>${esc(l.name)}</h2>
        <small>${esc(l.region||'موقعیت ثبت نشده')}</small>
      </div>
    </div>

    <div class="card" style="padding:15px">
      <div class="land-title-row" style="display:flex;justify-content:space-between;gap:10px">
        <div class="land-title-wrap">
          ${landThumb(l)}
          <div class="land-title-text">
            <h3>${esc(l.name)}</h3>
            <small>${esc(l.owner||'')}</small>
          </div>
        </div>
        <b>${formatArea(l.area)}</b>
      </div>

      <div class="stat-grid" style="margin-top:12px">
        <div class="stat-box">
          <span>هزینه واقعی</span>
          <b>${money(cost)}</b>
        </div>
        <div class="stat-box">
          <span>درآمد</span>
          <b class="money-positive">${money(income)}</b>
        </div>
        <div class="stat-box">
          <span>سود / زیان</span>
          <b class="${net>=0?'money-positive':'money-negative'}">${money(net)}</b>
        </div>
        <div class="stat-box">
          <span>محصول</span>
          <b>${esc(l.crop||'ثبت نشده')}</b>
        </div>
      </div>
    </div>

    <div class="yar-land-entry card" style="padding:15px;margin-top:12px">
      <div style="display:flex;align-items:center;gap:10px">
        <div class="yarpro-avatar">🌾</div>
        <div>
          <h3 style="margin:0">کشاورزیار این زمین</h3>
          <small>دستیار هوشمند مخصوص همین زمین</small>
        </div>
      </div>
      <p style="line-height:1.9">
        درباره وضعیت، کشت، هزینه‌ها، آب‌وهوا یا عکس این زمین سؤال کن.
      </p>
      <button class="btn" onclick="landYar('${esc(l.id)}')">
        🌱 ورود به کشاورزیار زمین
      </button>
    </div>

    <div class="land-tabs">
      <button class="active" onclick="landTab('overview')">نمای کلی</button>
      <button onclick="landTab('weather')">🌤️ آب‌وهوا</button>
      <button onclick="landTab('economy')">🌱 کشت و اقتصاد</button>
      <button onclick="landTab('edit')">✏️ ویرایش</button>
    </div>

    <section id="landTabArea"></section>
  </main>
  `;

  landTab('overview');
  window.scrollTo({top:0,left:0,behavior:'instant'});
}

function landTab(tab){
  const l=state.lands.find(x=>x.id===window.currentLandId);
  const box=document.querySelector('#landTabArea');
  if(!l||!box)return;

  document.querySelectorAll('.land-tabs button')
    .forEach(b=>b.classList.remove('active'));

  const buttons=[...document.querySelectorAll('.land-tabs button')];
  const index={overview:0,weather:1,economy:2,edit:3}[tab];
  if(buttons[index])buttons[index].classList.add('active');

  if(tab==='overview'){
    box.innerHTML=`
    <div class="card">
      <h3>📋 اطلاعات زمین</h3>
      <div class="account-row"><span>مالکیت</span><b>${esc(l.owner)}</b></div>
      <div class="account-row"><span>اجاره</span><b>${esc(l.rent||'ندارد')}</b></div>
      <div class="account-row"><span>خاک</span><b>${esc(l.soil||'ثبت نشده')}</b></div>
      <div class="account-row"><span>منبع آب</span><b>${esc(l.water||'ثبت نشده')}</b></div>
      <div class="account-row"><span>آبیاری</span><b>${esc(l.irrigation||'ثبت نشده')}</b></div>
      <div class="account-row"><span>کشت</span><b>${esc(l.crop||'ثبت نشده')}</b></div>
      <div class="account-row"><span>یادداشت</span><b>${esc(l.notes||'-')}</b></div>
    </div>

    <div class="card" style="margin-top:12px">
      <h3>📐 اندازه زمین</h3>
      <div class="stat-grid">
        <div class="stat-box">
          <span>مساحت</span>
          <b>${formatArea(l.area)}</b>
        </div>
        <div class="stat-box">
          <span>محیط</span>
          <b>${money(l.perimeter)} متر</b>
        </div>
      </div>
    </div>

    <div class="photo-box card" style="margin-top:12px">
      <h3>📷 تحلیل عکس زمین</h3>
      <p>عکس محصول، برگ، خاک یا مشکل زمین را برای کشاورزیار بفرست.</p>

      <div class="photo-actions">
        <button onclick="landPhotoPick('${esc(l.id)}')">🖼️ انتخاب عکس</button>
        <button onclick="landPhotoCamera('${esc(l.id)}')">📷 دوربین</button>
      </div>

      <input
        id="landPhotoInput"
        type="file"
        accept="image/*"
        style="display:none"
        onchange="landPhotoSelected(event,'${esc(l.id)}')"
      />

      <div id="landPhotoPreview" class="photo-preview"></div>
    </div>

    <div class="ai-history card" style="margin-top:12px">
      <h3>🧠 سابقه تحلیل عکس</h3>
      ${renderAiHistory(l)}
    </div>
    `;
  }

  if(tab==='weather'){
    box.innerHTML=`
      <div class="card">
        <h3>🌤️ آب‌وهوای این زمین</h3>
        <p>موقعیت زمین: ${esc(l.region||'ثبت نشده')}</p>
        <div id="landWeatherBox">
          <div class="empty-state">
            <div class="big">🌦️</div>
            <p>در حال دریافت اطلاعات آب‌وهوا...</p>
          </div>
        </div>
      </div>
    `;
    loadLandWeather(l);
  }

  if(tab==='economy'){
    renderLandEconomy(l,box);
  }

  if(tab==='edit'){
    renderLandEdit(l,box);
  }
}

function renderAiHistory(l){
  const arr=Array.isArray(l.aiAnalyses)?l.aiAnalyses:[];
  if(!arr.length){
    return `
      <div class="empty-state">
        <div class="big">📷</div>
        <p>هنوز تحلیل عکسی ثبت نشده است.</p>
      </div>
    `;
  }

  return arr.slice().reverse().map(x=>`
    <div class="ai-history-item">
      ${x.image?`<img src="${esc(x.image)}" alt="عکس تحلیل شده">`:''}
      <div class="date">${new Date(x.createdAt||Date.now()).toLocaleString('fa-IR')}</div>
      <p>${esc(x.result||x.reply||'در انتظار نتیجه تحلیل')}</p>
    </div>
  `).join('');
}

function renderLandEconomy(l,box){
  const expenses=l.expenses||[];
  const incomes=l.incomes||[];

  box.innerHTML=`
    <div class="econ-summary">
      <div class="econ-box">
        <span>هزینه</span>
        <strong class="money-negative">${money(totalExpenses(l))}</strong>
      </div>
      <div class="econ-box">
        <span>درآمد</span>
        <strong class="money-positive">${money(totalIncome(l))}</strong>
      </div>
      <div class="econ-box">
        <span>خالص</span>
        <strong class="${profit(l)>=0?'money-positive':'money-negative'}">${money(profit(l))}</strong>
      </div>
    </div>

    <div class="card">
      <h3>💸 هزینه‌های مراحل کشت</h3>
      <button class="btn" onclick="addLandExpense('${esc(l.id)}')">
        + ثبت هزینه
      </button>

      <div>
        ${
          expenses.length
          ? expenses.map(x=>`
            <div class="stage-item">
              <div class="stage-top">
                <b>${esc(x.stage||x.title||'هزینه')}</b>
                <strong>${money(x.total||x.amount)} تومان</strong>
              </div>
              <div class="stage-meta">
                <span>${esc(x.date||'بدون تاریخ')}</span>
                ${x.quantity?`<span>${money(x.quantity)} ${esc(x.unit||'واحد')}</span>`:''}
                ${x.unitPrice?`<span>هر واحد ${money(x.unitPrice)}</span>`:''}
              </div>
              <div class="stage-actions">
                <button onclick="editLandExpense('${esc(l.id)}','${esc(x.id||'')}')">ویرایش</button>
                <button class="danger" onclick="deleteLandExpense('${esc(l.id)}','${esc(x.id||'')}')">حذف</button>
              </div>
            </div>
          `).join('')
          : `<div class="empty-state"><div class="big">💸</div><p>هنوز هزینه‌ای ثبت نشده.</p></div>`
        }
      </div>
    </div>

    <div class="card" style="margin-top:12px">
      <h3>💰 درآمد و فروش</h3>
      <button class="btn" onclick="addLandIncome('${esc(l.id)}')">
        + ثبت درآمد
      </button>

      ${
        incomes.length
        ? incomes.map(x=>`
          <div class="stage-item">
            <div class="stage-top">
              <b>${esc(x.title||'فروش محصول')}</b>
              <strong class="money-positive">${money(x.amount)} تومان</strong>
            </div>
            <div class="stage-meta">
              <span>${esc(x.date||'بدون تاریخ')}</span>
              ${x.quantity?`<span>${money(x.quantity)} ${esc(x.unit||'واحد')}</span>`:''}
            </div>
            <div class="stage-actions">
              <button class="danger" onclick="deleteLandIncome('${esc(l.id)}','${esc(x.id||'')}')">حذف</button>
            </div>
          </div>
        `).join('')
        : `<div class="empty-state"><div class="big">💰</div><p>هنوز درآمدی ثبت نشده.</p></div>`
      }
    </div>
  `;
}

function addLandExpense(id){
  const stage=prompt('مرحله هزینه را وارد کن:', 'آماده‌سازی زمین');
  if(stage===null)return;

  const quantity=prompt('مقدار:', '1');
  if(quantity===null)return;

  const unit=prompt('واحد:', 'مورد');
  if(unit===null)return;

  const unitPrice=prompt('قیمت هر واحد (تومان):','0');
  if(unitPrice===null)return;

  const total=(Number(quantity)||0)*(Number(unitPrice)||0);

  const l=state.lands.find(x=>x.id===id);
  if(!l)return;

  l.expenses=l.expenses||[];
  l.expenses.push({
    id:uid(),
    stage,
    quantity:Number(quantity)||0,
    unit,
    unitPrice:Number(unitPrice)||0,
    total,
    date:new Date().toISOString().slice(0,10)
  });

  saveState();
  landTab('economy');
  toast('هزینه ثبت شد');
}

function editLandExpense(landId,expenseId){
  const l=state.lands.find(x=>x.id===landId);
  const x=(l?.expenses||[]).find(e=>e.id===expenseId);
  if(!x)return;

  const total=prompt('مبلغ نهایی هزینه (تومان):',String(x.total||0));
  if(total===null)return;

  x.total=Number(total)||0;
  saveState();
  landTab('economy');
  toast('هزینه ویرایش شد');
}

function deleteLandExpense(landId,expenseId){
  const l=state.lands.find(x=>x.id===landId);
  if(!l)return;

  if(!confirm('این هزینه حذف شود؟'))return;

  l.expenses=(l.expenses||[]).filter(x=>x.id!==expenseId);
  saveState();
  landTab('economy');
  toast('هزینه حذف شد');
}

function addLandIncome(id){
  const title=prompt('عنوان درآمد:', 'فروش محصول');
  if(title===null)return;

  const amount=prompt('مبلغ درآمد (تومان):','0');
  if(amount===null)return;

  const l=state.lands.find(x=>x.id===id);
  if(!l)return;

  l.incomes=l.incomes||[];
  l.incomes.push({
    id:uid(),
    title,
    amount:Number(amount)||0,
    date:new Date().toISOString().slice(0,10)
  });

  saveState();
  landTab('economy');
  toast('درآمد ثبت شد');
}

function deleteLandIncome(landId,incomeId){
  const l=state.lands.find(x=>x.id===landId);
  if(!l)return;

  if(!confirm('این درآمد حذف شود؟'))return;

  l.incomes=(l.incomes||[]).filter(x=>x.id!==incomeId);
  saveState();
  landTab('economy');
  toast('درآمد حذف شد');
}
</script>
<script>
function renderLandEdit(l,box){
  box.innerHTML=`
  <div class="card">
    <h3>✏️ ویرایش اطلاعات زمین</h3>

    <label>نام زمین</label>
    <input id="editLandName" value="${esc(l.name)}">

    <label>منطقه / موقعیت</label>
    <input id="editLandRegion" value="${esc(l.region)}">

    <label>وضعیت مالکیت</label>
    <select id="editLandOwner">
      <option ${l.owner==='مالک'?'selected':''}>مالک</option>
      <option ${l.owner==='اجاره‌ای'?'selected':''}>اجاره‌ای</option>
      <option ${l.owner==='شراکتی'?'selected':''}>شراکتی</option>
    </select>

    <label>اطلاعات اجاره</label>
    <input id="editLandRent" value="${esc(l.rent)}">

    <label>نوع خاک</label>
    <input id="editLandSoil" value="${esc(l.soil)}">

    <label>منبع آب</label>
    <input id="editLandWater" value="${esc(l.water)}">

    <label>روش آبیاری</label>
    <input id="editLandIrrigation" value="${esc(l.irrigation)}">

    <label>محصول / کشت</label>
    <input id="editLandCrop" value="${esc(l.crop)}">

    <label>یادداشت</label>
    <textarea id="editLandNotes">${esc(l.notes)}</textarea>

    <button class="btn" onclick="saveLandEdit('${esc(l.id)}')">

function yarAiContext(id){
  if(!id)return null;

  const l=state.lands.find(x=>x.id===id);
  if(!l)return null;

  return {
    id:l.id,
    name:l.name,
    region:l.region,
    owner:l.owner,
    area:l.area,
    crop:l.crop,
    soil:l.soil,
    water:l.water,
    irrigation:l.irrigation,
    notes:l.notes,
    expenses:(l.expenses||[]).slice(-20),
    incomes:(l.incomes||[]).slice(-20)
  };
}

function yarCompactState(){
  return {
    lands:(state.lands||[]).map(l=>({
      id:l.id,
      name:l.name,
      region:l.region,
      area:l.area,
      crop:l.crop,
      soil:l.soil,
      water:l.water,
      irrigation:l.irrigation
    })),
    inventory:(state.inventory||[]).slice(-30)
  };
}

async function yarSendToBackend({message,image=null,land=null}){
  const endpoint=String(YAR_AI_ENDPOINT||'').trim();

  if(!endpoint||endpoint.includes('REPLACE-WITH-YOUR-WORKER')){
    return {
      reply:yarReply(message,land)
    };
  }

  const payload={
    message:String(message||''),
    image:image||null,
    land:land?yarAiContext(land.id):null,
    state:yarCompactState()
  };

  const response=await fetch(endpoint,{
    method:'POST',
    headers:{
      'Content-Type':'application/json'
    },
    body:JSON.stringify(payload)
  });

  if(!response.ok){
    throw new Error('AI backend HTTP '+response.status);
  }

  const data=await response.json();

  if(!data||typeof data.reply!=='string'){
    throw new Error('Invalid AI response');
  }

  return data;
}

/* ===== GENERAL KESHAVAR-YAR ===== */

function yarReply(message,land=null){
  const q=String(message||'').trim();

  if(!q){
    return 'سؤالت را درباره کشت، زمین، هزینه، آب، کود، آفت یا محصول بپرس.';
  }

  if(land){
    return `برای زمین «${land.name}» بهتر است بر اساس محصول، خاک، آب و سابقه هزینه‌ها تصمیم بگیری. اگر سؤال مشخصت را بگویی، راهنمایی دقیق‌تری می‌دهم.`;
  }

  if(/هزینه|خرج|قیمت/.test(q)){
    return 'برای محاسبه دقیق هزینه، نوع محصول، مساحت زمین، مقدار بذر و کود و هزینه عملیات را وارد کن.';
  }

  if(/کود|سم|آفت|بیماری/.test(q)){
    return 'برای پیشنهاد دقیق‌تر، نام محصول، مرحله رشد و در صورت امکان یک عکس واضح از برگ یا بوته بفرست.';
  }

  if(/آب|آبیاری/.test(q)){
    return 'زمان آبیاری به محصول، مرحله رشد، نوع خاک، دما و روش آبیاری بستگی دارد.';
  }

  if(/گندم|جو|ذرت|برنج/.test(q)){
    return 'برای انتخاب کشت مناسب باید منطقه، آب در دسترس، نوع خاک، فصل و هدف اقتصادی بررسی شود.';
  }

  return 'متوجه شدم. برای پاسخ دقیق‌تر، سؤال را با جزئیات بیشتری درباره زمین یا محصولت بگو.';
}

async function yarSend(){
  const input=document.getElementById('yarInput');
  const chat=document.getElementById('yarChat');

  const text=input.value.trim();
  const image=window.yarPhotoData||null;

async function loadLandWeather(l){
  const box=document.getElementById('landWeatherBox');
  if(!box)return;

  if(!l.region){
    box.innerHTML=`
      <div class="empty-state">
        <div class="big">📍</div>
        <p>موقعیت این زمین ثبت نشده است.</p>
        <button class="btn" onclick="landTab('edit')">ثبت موقعیت</button>
      </div>
    `;
    return;
  }

  try{

    const geo=await fetch(
      'https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+
      encodeURIComponent(l.region)
    );

    const places=await geo.json();

    if(!places.length){
      box.innerHTML=`
        <div class="empty-state">
          <div class="big">📍</div>
          <p>موقعیت زمین پیدا نشد.</p>
        </div>
      `;
      return;
    }

    const lat=Number(places[0].lat);
    const lon=Number(places[0].lon);

    const url=
      'https://api.open-meteo.com/v1/forecast'+
      '?latitude='+lat+
      '&longitude='+lon+
      '&current=temperature_2m,relative_humidity_2m,precipitation,wind_speed_10m,weather_code'+
      '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max'+
      '&forecast_days=7'+
      '&timezone=auto';

    const response=await fetch(url);
    const data=await response.json();

    l.weather={
      lat,
      lon,
      current:data.current,
      daily:data.daily,
      updatedAt:Date.now()
    };

    saveState();

    const weatherIcon=code=>{
      code=Number(code);
      if(code===0)return'☀️';
      if(code<=3)return'🌤️';
      if(code<=48)return'🌫️';
      if(code<=67)return'🌧️';
      if(code<=77)return'🌨️';
      if(code<=82)return'🌦️';
      if(code<=99)return'⛈️';
      return'🌤️';
    };

    const current=data.current||{};

    box.innerHTML=`
      <div class="weather-card">
        <div class="weather-main">
          <div>
            <div style="font-size:13px;opacity:.85">
              ${esc(l.region)}
            </div>
            <div class="weather-temp">
              ${Math.round(Number(current.temperature_2m)||0)}°
            </div>
            <div style="font-size:12px">
              رطوبت ${Math.round(Number(current.relative_humidity_2m)||0)}٪
            </div>
          </div>

          <div class="weather-icon">
            ${weatherIcon(current.weather_code)}
          </div>
        </div>

        <div class="weather-note">
          💨 سرعت باد:
          ${Math.round(Number(current.wind_speed_10m)||0)}
          کیلومتر بر ساعت
          <br>
          💧 بارش فعلی:
          ${Number(current.precipitation||0).toLocaleString('fa-IR')}
          میلی‌متر
        </div>

        <div class="weather-days">
          ${
            (data.daily?.time||[]).map((day,i)=>`
              <div class="weather-day">
                <span>${new Date(day).toLocaleDateString('fa-IR',{weekday:'short'})}</span>
                <b>${weatherIcon(data.daily.weather_code[i])}</b>
                <span>
                  ${Math.round(data.daily.temperature_2m_max[i])}°
                  /
                  ${Math.round(data.daily.temperature_2m_min[i])}°
                </span>
                <small>
                  بارش ${data.daily.precipitation_probability_max[i]||0}٪
                </small>
              </div>
            `).join('')
          }
        </div>
      </div>
    `;

  }catch(e){

    console.error(e);

    box.innerHTML=`
      <div class="empty-state">
        <div class="big">⚠️</div>
        <p>دریافت آب‌وهوا انجام نشد.</p>
        <button class="btn" onclick="loadLandWeather(window.currentLandId?state.lands.find(x=>x.id===window.currentLandId):null)">
          تلاش دوباره
        </button>
      </div>
    `;
  }
}

              <b>${esc(x.name)}</b>
              <small>${esc(x.unit||'واحد')}</small>
              <div class="qty">${money(x.qty)}</div>

              <div class="inventory-actions">
                <button onclick="inventoryAdd(${i})">ورودی</button>
                <button onclick="inventoryUse(${i})">مصرف</button>
              </div>
            </div>
          `).join('')
          : `
            <div class="empty-state" style="grid-column:1/-1">
              <div class="big">📦</div>
              <p>انبار هنوز خالی است.</p>
            </div>
          `
        }
      </div>
    </div>

  </main>
  `;

  window.scrollTo({top:0,left:0,behavior:'instant'});
}

function inventoryAdd(index){
  let item;

  if(index!==undefined){
    item=state.inventory[index];
  }else{
    const name=prompt('نام قلم انبار:');
    if(!name)return;

    const unit=prompt('واحد:', 'کیلو');
    if(unit===null)return;

    item={
      id:uid(),
      name,
      unit,
      qty:0,
      input:0,
      used:0
    };

    state.inventory.push(item);
  }

  const amount=prompt('مقدار ورودی:','0');
  if(amount===null)return;

  const n=Number(amount)||0;

  item.qty=(Number(item.qty)||0)+n;
  item.input=(Number(item.input)||0)+n;

  saveState();
  inventory();

  toast('ورودی انبار ثبت شد');
}

function inventoryUse(index){
  if(index===undefined){
    if(!state.inventory.length){
      toast('ابتدا یک قلم به انبار اضافه کن');
      return;
    }

    const name=prompt(
      'نام قلم برای مصرف را وارد کن:\n'+
      state.inventory.map(x=>x.name).join('، ')
    );

    if(!name)return;

    index=state.inventory.findIndex(
      x=>x.name.trim()===name.trim()
    );

    if(index<0){
      toast('این قلم در انبار پیدا نشد');
      return;
    }
  }

  const item=state.inventory[index];

  const amount=prompt(
    `مصرف ${item.name} — موجودی: ${money(item.qty)}`,
    '0'
  );

  if(amount===null)return;

  const n=Number(amount)||0;

  if(n<=0)return;

  if(n>Number(item.qty||0)){
    toast('موجودی کافی نیست');
    return;
  }

  item.qty-=n;
  item.used=(Number(item.used)||0)+n;

  saveState();
  inventory();

  toast('مصرف انبار ثبت شد');
}

function saveProfile(){
  state.profile={
    name:document.getElementById('profileName')?.value.trim()||'',
    phone:document.getElementById('profilePhone')?.value.trim()||'',
    region:document.getElementById('profileRegion')?.value.trim()||''
  };

  saveState();
  profile();

  toast('اطلاعات ذخیره شد');
}

function restoreBackup(event){
  const file=event.target.files?.[0];
  if(!file)return;

  const reader=new FileReader();

  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);

      if(!data||typeof data!=='object'){
        throw new Error('invalid');
      }

      state={...state,...data};
      saveState();

      toast('پشتیبان بازیابی شد');
      go('home');

    }catch(e){
      toast('فایل پشتیبان معتبر نیست');
    }
  };

  reader.readAsText(file);
}
