<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#145c3a">
<title>یار کشاورز</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="v31-premium.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
body{min-height:100vh}header{max-width:720px;margin:0 auto;padding:12px 16px 4px;position:sticky;top:0;z-index:20;background:#f4f7f4ee;backdrop-filter:blur(12px)}
header b{color:#145c3a}header .brandbar{display:flex;align-items:center;gap:10px}.brand-logo{width:42px;height:42px;border-radius:14px;object-fit:cover;background:#e8f2ea}.page-title{font-size:12px;color:#718078}
main{min-height:calc(100vh - 160px)}.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:50;background:#fff;border-top:1px solid #dfe7e1;display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:7px 5px calc(7px + env(safe-area-inset-bottom));max-width:820px;margin:auto}.bottom-nav button{border:0;background:transparent;color:#6f7b74;border-radius:13px;padding:6px 2px;font-weight:800;font-size:10px}.bottom-nav button span{display:block;font-size:19px;line-height:1.15;margin-bottom:3px}.bottom-nav button.active{background:#eaf4ed;color:#145c3a}
.metric{font-size:28px;font-weight:950;color:#145c3a}.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:14px 0 8px}.section-title h2,.section-title h3{margin:0}
.premium-weather{background:linear-gradient(135deg,#104d35,#2f8159)!important;color:#fff!important}.premium-weather .muted{color:#d5e8db}.weather-main{display:flex;justify-content:space-between;align-items:center}.weather-icon{font-size:58px}.premium-weather .metric{color:#fff;font-size:50px}.weather-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:15px}.weather-grid .card{margin:0;background:#ffffff12;color:#fff;box-shadow:none;border:1px solid #ffffff22}.weather-grid strong{display:block;margin-top:5px}.weather-hours{display:flex;gap:8px;overflow:auto;margin-top:8px}.weather-hours>div{min-width:72px;text-align:center;padding:10px;border-radius:14px;background:#ffffff12;border:1px solid #ffffff18}.weather-hours b,.weather-hours strong,.weather-hours small{display:block;margin:4px 0}.photo-preview{min-height:310px;border-radius:20px;background:linear-gradient(135deg,#e8f0ea,#d7e4db);display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:12px}.photo-preview img{width:100%;height:100%;min-height:310px;object-fit:contain;background:#eef4ef}.photo-empty{font-size:60px;opacity:.5}.upload-photo{display:block;text-align:center;padding:15px;border-radius:14px;background:#eaf4ed;color:#145c3a;font-weight:900;margin-bottom:8px;cursor:pointer}.secondary{border:0;border-radius:14px;padding:12px 15px;background:#eaf4ed;color:#145c3a;font-weight:850;width:100%;margin:6px 0}
@media(max-width:600px){.weather-grid{grid-template-columns:1fr 1fr}.bottom-nav button span{font-size:17px}.bottom-nav button{font-size:9px}}
</style>
</head>
<body>
<header><div class="brandbar"><img class="brand-logo" src="logo.png" alt=""><div><b>یار کشاورز</b><div id="pageTitle" class="page-title">خانه</div></div></div></header>
<main id="app"></main>
<nav class="bottom-nav">
<button data-route="home" class="active"><span>⌂</span>خانه</button>
<button data-route="lands"><span>⌖</span>زمین‌ها</button>
<button data-route="add"><span>＋</span>ثبت زمین</button>
<button data-route="measure"><span>▱</span>متراژ</button>
<button data-route="weather"><span>☀</span>هوا</button>
<button data-route="photos"><span>▣</span>عکس</button>
<button data-route="inventory"><span>▤</span>انبار</button>
</nav>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
<script>
document.querySelectorAll(".bottom-nav [data-route]").forEach(b=>b.addEventListener("click",()=>setRoute(b.dataset.route)));
</script>
</body>
</html>
